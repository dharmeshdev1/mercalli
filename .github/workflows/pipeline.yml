# Every five minutes: poll every status page, run the models, publish the API and deploy the site.
# Engine state (a SQLite file) travels between runs in the Actions cache. Models, graph and census
# come from the `artifacts` release, written by the models workflow, and the web app from the `site`
# release, written by the web workflow. Both are cached by asset id, so they are only downloaded
# again after a new one is published.
name: Live pipeline

on:
  schedule:
    # Off the round minutes, which GitHub's scheduler serves last under load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # to delete superseded engine state caches and keep the cadence
  attestations: read

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERCALLI_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra ml

      - name: Restore engine state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore embedding model
        uses: actions/cache@v6
        with:
          path: .model-cache
          key: fastembed-all-MiniLM-L6-v2-1

      - name: Find the current artifacts and web build
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-keys.sh

      - name: Restore model artifacts
        uses: actions/cache@v6
        with:
          path: artifacts
          key: artifacts-${{ steps.keys.outputs.artifacts || 'none' }}

      - name: Restore web build
        uses: actions/cache@v6
        with:
          path: web-build
          key: web-${{ steps.keys.outputs.web || 'none' }}

      - name: Download what the caches did not have
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_ASSET: ${{ steps.keys.outputs.artifacts_asset }}
          WEB_ASSET: ${{ steps.keys.outputs.web_asset }}
        run: scripts/fetch-releases.sh

      - name: Tick and publish
        run: |
          mkdir -p state
          uv run mercalli tick --db sqlite:///state/mercalli.db --artifacts artifacts --cache state/cache \
            --publish site --report state/last-tick.json

      - name: Save engine state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Delete superseded engine state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each run saves a new state cache. Keep the newest three so the history caches are never
          # pushed out of the repository's cache quota.
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Keep the cadence, whatever the scheduler does
        if: always()
        continue-on-error: true  # never the reason a deployed site is reported as failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub's cron scheduler can be hours late or silent, especially for a five-minute
          # schedule. So every run, scheduled or not, starts the next one unless another is already
          # queued or running, paced to about five minutes; the cron schedule only restarts the chain
          # if it ever breaks. The daily models run and the weekly census are started here when they
          # are overdue, and the workflows are re-enabled once a day, so a quiet repository is not
          # switched off by GitHub's 60-day inactivity rule.
          now=$(date -u +%s)
          due() {  # due <workflow file> <seconds>: no success in that long, and none running now
            local last status
            last="$(gh run list --workflow "$1" --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')"
            status="$(gh run list --workflow "$1" --limit 1 --json status --jq '.[0].status // "none"')"
            [ "$status" != "in_progress" ] && [ "$status" != "queued" ] || return 1
            [ -z "$last" ] || [ $(( now - $(date -u -d "$last" +%s) )) -gt "$2" ]
          }
          if due models.yml 90000; then
            gh workflow run models.yml && echo "started the daily models run"
            for w in pipeline.yml models.yml census.yml; do gh workflow enable "$w" || true; done
          fi
          if due census.yml 691200; then gh workflow run census.yml && echo "started the weekly census"; fi
          others="$(gh run list --workflow pipeline.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length")"
          if [ "${others:-0}" -gt 0 ]; then
            echo "another run is queued or running; nothing to do"
            exit 0
          fi
          started="$(gh run view "$GITHUB_RUN_ID" --json startedAt --jq .startedAt)"
          spent=$(( now - $(date -u -d "$started" +%s) ))
          if [ "$spent" -lt 270 ]; then sleep $(( 270 - spent )); fi
          gh workflow run pipeline.yml

  # Deploys what tick built. It runs none of the third-party code above, so it alone holds the
  # Pages, OIDC and repository-write permissions a deployment needs.
  deploy:
    needs: tick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      actions: read  # to find this run's github-pages artifact
      contents: write  # to create the commit object that names the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploys this run's github-pages artifact through the Pages API. Pages names a deployment
          # by its build version and keeps serving the old files when a deployment reuses one, and
          # actions/deploy-pages always uses the bare commit, so between commits the site stopped
          # changing. Each run deploys under its own version. Refusals (an earlier deployment still
          # finishing) are retried; the step ends when Pages reports the deployment live.
          set -euo pipefail
          # The build version has to be a commit of this repository, so each run makes one: the same
          # tree as the deployed commit, on no branch, never part of the history.
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          BUILD_VERSION="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f tree="$tree" -f "parents[]=$GITHUB_SHA" \
            -f message="Pages deployment for run $GITHUB_RUN_ID" -f "author[name]=Dharmesh Meena" \
            -f "author[email]=176051217+dharmeshdev1@users.noreply.github.com" --jq .sha)"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          echo "::add-mask::$oidc"
          for attempt in 1 2 3 4 5; do
            if out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$artifact" \
                -f pages_build_version="$BUILD_VERSION" -f oidc_token="$oidc" 2>&1)"; then
              break
            fi
            echo "attempt $attempt refused: $out"
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 45
          done
          id="$(jq -r '.id // (.status_url | split("/") | last)' <<<"$out")"
          echo "page_url=$(jq -r '.page_url // ""' <<<"$out")" >> "$GITHUB_OUTPUT"
          status=unknown
          for _ in $(seq 1 120); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status)"
            case "$status" in
              succeed) echo "deployed $BUILD_VERSION"; exit 0 ;;
              *failed*|*cancelled*|*lost*|*error*) echo "::error::Pages deployment $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment still $status after ten minutes"
          exit 1
