[project]
name = "mercalli"
version = "0.1.0"
description = "Outage intelligence for the services you depend on: live status, dependency maps and forecasts of how long an incident will last and what it will hit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Dharmesh Meena" }]
keywords = ["outages", "status pages", "incident management", "reliability", "sre", "aiops", "forecasting", "dependency mapping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "typer>=0.15",
  "rich>=13.9",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "dnspython>=2.7",
]

[project.optional-dependencies]
ml = [
  "numpy>=2.1",
  "polars>=1.20",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "fastembed>=0.5",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "prometheus-client>=0.21",
  "psycopg[binary]>=3.2",
]
all = ["mercalli[ml,server]"]

[project.scripts]
mercalli = "mercalli.cli:app"

[project.urls]
Homepage = "https://dharmeshdev1.github.io/mercalli/"
Repository = "https://github.com/dharmeshdev1/mercalli"
Documentation = "https://github.com/dharmeshdev1/mercalli/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "httpx-sse>=0.4",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mercalli"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "mercalli/_catalog"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "C4", "PT"]
ignore = [
  "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003",
  # The CLI imports heavy modules inside commands so `mercalli --help` stays instant.
  "PLC0415",
  "PT018", "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# An SVG template: its lines are markup, not code.
"scripts/readme_hero.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastembed.*"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
