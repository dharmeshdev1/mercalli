# Services Mercalli watches, before verification.
#
# Each entry names a service, the category it belongs to, where its public status page lives and the
# domains its customers actually talk to. `mercalli catalog discover` checks every entry, follows
# redirects, works out which status page software it uses and writes the verified result to
# catalog/services.yaml. Entries it cannot verify are kept here and retried on the next run.
#
# Categories: cloud, edge, dns, hosting, devtools, data, observability, ai, payments, messaging,
# collaboration, identity, commerce, media, consumer.

