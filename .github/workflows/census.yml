# Weekly dependency census of the top 10,000 domains and every catalog domain, run from a GitHub
# hosted runner so the vantage point is a shared, documented one. Results go to the `artifacts`
# release as census.tar.gz, where the Sunday training run picks them up.
name: Census

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Run the census
        run: |
          uv run python -m mercalli.census --top 10000 --extra-catalog --out census \
            --cache-dir .census-cache --record-network

      - name: Publish the results
        run: |
          tar -czf census.tar.gz -C census domains.parquet summary.json
          if ! gh release view artifacts >/dev/null 2>&1; then
            gh release create artifacts --prerelease --title "Model artifacts" \
              --notes "Trained models, the dependency graph, census results and the public incident dataset. Updated weekly."
          fi
          gh release upload artifacts census.tar.gz --clobber
