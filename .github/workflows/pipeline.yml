# Every five minutes: poll every status page, run the models, publish the API and deploy the site.
# Engine state (a SQLite file) travels between runs in the Actions cache. Models, graph and census
# come from the `artifacts` release, written by the models workflow, and the web app from the `site`
# release, written by the web workflow. Both are cached by asset id, so they are only downloaded
# again after a new one is published.
name: Live pipeline

on:
  schedule:
    # Off the round minutes, which GitHub's scheduler serves last under load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # to delete superseded engine state caches
  attestations: read

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MERCALLI_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra ml

      - name: Restore engine state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Restore embedding model
        uses: actions/cache@v6
        with:
          path: .model-cache
          key: fastembed-all-MiniLM-L6-v2-1

      - name: Find the current artifacts and web build
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-keys.sh

      - name: Restore model artifacts
        uses: actions/cache@v6
        with:
          path: artifacts
          key: artifacts-${{ steps.keys.outputs.artifacts || 'none' }}

      - name: Restore web build
        uses: actions/cache@v6
        with:
          path: web-build
          key: web-${{ steps.keys.outputs.web || 'none' }}

      - name: Download what the caches did not have
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_ASSET: ${{ steps.keys.outputs.artifacts_asset }}
          WEB_ASSET: ${{ steps.keys.outputs.web_asset }}
        run: scripts/fetch-releases.sh

      - name: Tick and publish
        run: |
          mkdir -p state
          uv run mercalli tick --db sqlite:///state/mercalli.db --artifacts artifacts --cache state/cache \
            --publish site --report state/last-tick.json

      - name: Save engine state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Delete superseded engine state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each run saves a new state cache. Keep the newest three so the history caches are never
          # pushed out of the repository's cache quota.
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Keep the cadence, whatever the scheduler does
        if: always()
        continue-on-error: true  # never the reason a deployed site is reported as failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub's cron scheduler can be hours late or silent, especially for a five-minute
          # schedule. So every run, scheduled or not, starts the next one unless another is already
          # queued or running, paced to about five minutes; the cron schedule only restarts the chain
          # if it ever breaks. The daily models run and the weekly census are started here when they
          # are overdue, and the workflows are re-enabled once a day, so a quiet repository is not
          # switched off by GitHub's 60-day inactivity rule.
          now=$(date -u +%s)
          due() {  # due <workflow file> <seconds>: no success in that long, and none running now
            local last status
            last="$(gh run list --workflow "$1" --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')"
            status="$(gh run list --workflow "$1" --limit 1 --json status --jq '.[0].status // "none"')"
            [ "$status" != "in_progress" ] && [ "$status" != "queued" ] || return 1
            [ -z "$last" ] || [ $(( now - $(date -u -d "$last" +%s) )) -gt "$2" ]
          }
          if due models.yml 90000; then
            gh workflow run models.yml && echo "started the daily models run"
            for w in pipeline.yml models.yml census.yml; do gh workflow enable "$w" || true; done
          fi
          if due census.yml 691200; then gh workflow run census.yml && echo "started the weekly census"; fi
          others="$(gh run list --workflow pipeline.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length")"
          if [ "${others:-0}" -gt 0 ]; then
            echo "another run is queued or running; nothing to do"
            exit 0
          fi
          started="$(gh run view "$GITHUB_RUN_ID" --json startedAt --jq .startedAt)"
          spent=$(( now - $(date -u -d "$started" +%s) ))
          if [ "$spent" -lt 270 ]; then sleep $(( 270 - spent )); fi
          gh workflow run pipeline.yml
